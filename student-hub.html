<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学生成长管理平台</title>
<style>
:root{
  --bg:#f5f6fa; --panel:#ffffff; --line:#e6e8f0; --line2:#eef0f6;
  --tx:#1c2033; --tx2:#5b6478; --tx3:#8b93a7;
  --pri:#4f46e5; --pri-l:#eef0ff; --pri-d:#3f37c9;
  --ok:#10b981; --ok-l:#e7f8f1; --warn:#f59e0b; --warn-l:#fef4e3;
  --dan:#ef4444; --dan-l:#fdecec; --info:#0ea5e9; --info-l:#e6f6fd;
  --r:14px; --sd:0 1px 2px rgba(20,25,50,.05),0 6px 18px rgba(20,25,50,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--tx);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#d3d7e3;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.side{width:224px;flex:0 0 224px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:20}
.brand{padding:20px 18px 14px;display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#0ea5e9);
  display:flex;align-items:center;justify-content:center;flex:0 0 34px}
.brand h1{font-size:15px;font-weight:700;letter-spacing:.3px}
.brand p{font-size:11px;color:var(--tx3)}
.nav{padding:6px 10px;flex:1;overflow:auto}
.nav button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 11px;border:0;background:none;
  border-radius:10px;cursor:pointer;color:var(--tx2);font-size:13.5px;text-align:left;transition:.15s;margin-bottom:2px}
.nav button:hover{background:#f3f4f9;color:var(--tx)}
.nav button.on{background:var(--pri-l);color:var(--pri);font-weight:600}
.nav button svg{width:17px;height:17px;flex:0 0 17px;opacity:.85}
.nav .badge{margin-left:auto;background:#e9ebf3;color:var(--tx2);font-size:11px;padding:1px 7px;border-radius:20px}
.nav button.on .badge{background:#fff;color:var(--pri)}
.side-foot{padding:12px;border-top:1px solid var(--line2);display:flex;gap:6px}
.side-foot button{flex:1;padding:7px;border:1px solid var(--line);background:#fff;border-radius:9px;
  cursor:pointer;font-size:12px;color:var(--tx2)}
.side-foot button:hover{border-color:var(--pri);color:var(--pri)}

.main{flex:1;margin-left:224px;min-width:0}
.top{position:sticky;top:0;z-index:15;background:rgba(245,246,250,.9);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h2{font-size:18px;font-weight:700}
.top .sub{font-size:12.5px;color:var(--tx3)}
.top .spacer{flex:1}
.wrap{padding:22px 26px 60px}

/* ---------- generic ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);
  background:#fff;cursor:pointer;font-size:13px;color:var(--tx2);transition:.15s;white-space:nowrap}
.btn:hover{border-color:#c9cde0;color:var(--tx)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--pri-d);border-color:var(--pri-d);color:#fff}
.btn.dan{color:var(--dan);border-color:#f3cfcf}
.btn.dan:hover{background:var(--dan-l);border-color:var(--dan);color:var(--dan)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn svg{width:15px;height:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sd)}
.pad{padding:18px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--tx3)}
.small{font-size:12.5px}
.empty{padding:46px 20px;text-align:center;color:var(--tx3)}
.empty svg{width:44px;height:44px;opacity:.3;margin-bottom:10px}

.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11.5px;
  background:#f0f2f7;color:var(--tx2);font-weight:500;white-space:nowrap}
.chip.p{background:var(--pri-l);color:var(--pri)}
.chip.g{background:var(--ok-l);color:#079669}
.chip.o{background:var(--warn-l);color:#b97609}
.chip.b{background:var(--info-l);color:#0284c7}
.chip.r{background:var(--dan-l);color:var(--dan)}

input[type=text],input[type=date],select,textarea{width:100%;padding:8px 11px;border:1px solid var(--line);
  border-radius:9px;background:#fff;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
textarea{min-height:82px;resize:vertical;line-height:1.65}
label.f{display:block;font-size:12.5px;color:var(--tx2);margin-bottom:5px;font-weight:500}
.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.form .full{grid-column:1/-1}

/* ---------- dashboard ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;box-shadow:var(--sd)}
.stat .k{font-size:12px;color:var(--tx3);display:flex;align-items:center;gap:7px}
.stat .k i{width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
.stat .k i svg{width:14px;height:14px}
.stat .v{font-size:26px;font-weight:700;margin-top:7px;letter-spacing:-.5px}
.stat .d{font-size:11.5px;color:var(--tx3);margin-top:2px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
@media(max-width:1080px){.grid2{grid-template-columns:1fr}}
.hd{display:flex;align-items:center;justify-content:space-between;padding:14px 17px;border-bottom:1px solid var(--line2)}
.hd h3{font-size:14.5px;font-weight:700}
.list .li{padding:11px 17px;border-bottom:1px solid var(--line2);display:flex;gap:11px;align-items:flex-start}
.list .li:last-child{border-bottom:0}
.av{width:32px;height:32px;border-radius:50%;flex:0 0 32px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:12.5px;font-weight:600}

/* ---------- students ---------- */
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.filters input[type=text]{width:210px}
.filters select{width:auto;min-width:120px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:14px}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sd);
  transition:.18s;position:relative}
.scard:hover{border-color:#cdd2e6;transform:translateY(-2px)}
.scard .toprow{display:flex;gap:11px;align-items:center;margin-bottom:11px}
.scard .av{width:42px;height:42px;flex:0 0 42px;font-size:15px}
.scard .nm{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.scard .mt{font-size:12px;color:var(--tx3)}
.scard .goal{font-size:12.5px;color:var(--tx2);background:#f7f8fc;border-radius:9px;padding:8px 10px;margin:9px 0;
  min-height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scard .acts{display:flex;gap:6px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line2)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}

/* ---------- timeline ---------- */
.tl{position:relative;padding-left:0}
.tl .it{position:relative;padding:0 0 4px 26px;border-left:2px solid var(--line);margin-left:8px;padding-bottom:18px}
.tl .it:last-child{border-left-color:transparent}
.tl .it::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;
  background:#fff;border:2.5px solid var(--pri)}
.tl .it.done::before{border-color:var(--ok)}
.tl .it .d{font-size:12px;color:var(--tx3);display:flex;gap:8px;align-items:center;margin-bottom:3px}
.tl .it .t{font-weight:600;font-size:14px}
.tl .it .c{color:var(--tx2);font-size:13px;margin-top:3px;white-space:pre-wrap}
.tl .it .n{margin-top:7px;font-size:12.5px;color:#0284c7;background:var(--info-l);padding:6px 10px;border-radius:8px;display:inline-block}

/* ---------- path ---------- */
.pgrid{display:grid;grid-template-columns:250px 1fr;gap:16px}
@media(max-width:960px){.pgrid{grid-template-columns:1fr}}
.plist{max-height:calc(100vh - 210px);overflow:auto}
.plist .pi{padding:10px 14px;display:flex;gap:9px;align-items:center;cursor:pointer;border-bottom:1px solid var(--line2)}
.plist .pi:hover{background:#f7f8fc}
.plist .pi.on{background:var(--pri-l)}
.plist .pi .av{width:28px;height:28px;flex:0 0 28px;font-size:11.5px}
.plist .pi .nm{font-size:13.5px;font-weight:600}
.plist .pi .pg{font-size:11.5px;color:var(--tx3)}
.pbar{height:7px;background:#eef0f6;border-radius:9px;overflow:hidden;margin-top:5px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#0ea5e9);border-radius:9px;transition:.4s}
.stages{margin-top:6px}
.stage{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line2);align-items:flex-start}
.stage:last-child{border-bottom:0}
.stage .dot{width:26px;height:26px;border-radius:50%;flex:0 0 26px;display:flex;align-items:center;justify-content:center;
  background:#f0f2f7;color:var(--tx3);font-size:12px;font-weight:700;margin-top:2px}
.stage.s-done .dot{background:var(--ok-l);color:var(--ok)}
.stage.s-doing .dot{background:var(--pri-l);color:var(--pri)}
.stage .ti{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stage .de{font-size:12.5px;color:var(--tx2);margin-top:2px}
.stage .du{font-size:11.5px;color:var(--tx3);margin-top:3px}
.stage .sp{flex:1}
.stage.done .ti{color:var(--tx3);text-decoration:line-through}

/* ---------- blog ---------- */
.bgrid{display:grid;grid-template-columns:230px 1fr;gap:16px}
@media(max-width:960px){.bgrid{grid-template-columns:1fr}}
.bhead{background:linear-gradient(135deg,#6366f1,#0ea5e9);border-radius:var(--r);padding:22px;color:#fff;position:relative;overflow:hidden}
.bhead::after{content:"";position:absolute;right:-40px;top:-50px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.12)}
.bhead .av{width:56px;height:56px;flex:0 0 56px;font-size:20px;border:2.5px solid rgba(255,255,255,.55)}
.bhead h3{font-size:20px;font-weight:700}
.bhead .g{font-size:13px;opacity:.9;margin-top:3px}
.bhead .bs{display:flex;gap:22px;margin-top:15px;position:relative;z-index:1}
.bhead .bs div b{display:block;font-size:19px;font-weight:700}
.bhead .bs div span{font-size:11.5px;opacity:.85}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px;margin-top:16px}
.post{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sd);
  display:flex;flex-direction:column;transition:.18s}
.post:hover{transform:translateY(-2px);border-color:#cdd2e6}
.post .cov{height:92px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;letter-spacing:.5px}
.post .bd{padding:13px 15px;flex:1}
.post .bd h4{font-size:14.5px;font-weight:700;margin:4px 0 5px;line-height:1.4}
.post .bd .s{font-size:12.5px;color:var(--tx2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.post .ft{padding:10px 15px;border-top:1px solid var(--line2);display:flex;gap:6px;align-items:center}
.post .ft .sp{flex:1}
.article{line-height:1.85;white-space:pre-wrap;font-size:13.5px;color:var(--tx2)}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(18,22,40,.42);backdrop-filter:blur(2px);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 20px 60px rgba(15,20,45,.28);animation:pop .2s}
.modal.wide{max-width:720px}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:between}
.modal .mh h3{font-size:16px;font-weight:700}
.modal .mb{padding:20px;overflow:auto}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:9px}
.xbtn{border:0;background:none;cursor:pointer;color:var(--tx3);padding:4px;border-radius:7px;display:flex}
.xbtn:hover{background:#f2f3f8;color:var(--tx)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#1c2033;color:#fff;
  padding:10px 20px;border-radius:10px;font-size:13px;z-index:99;box-shadow:0 8px 26px rgba(0,0,0,.2);animation:fade .2s}

@media(max-width:820px){
  .side{width:64px;flex:0 0 64px}.brand h1,.brand p,.nav span,.nav .badge,.side-foot span{display:none}
  .nav button{justify-content:center;padding:11px}.main{margin-left:64px}.wrap{padding:16px}
}
@media print{.side,.top,.no-print{display:none!important}.main{margin:0}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="M5 10v6c0 1.5 3.1 3 7 3s7-1.5 7-3v-6"/></svg></div>
      <div><h1>学生成长平台</h1><p>Student Hub</p></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button onclick="exportJSON()"><span>导出数据</span></button>
      <button onclick="$('#fileIn').click()"><span>导入</span></button>
    </div>
    <input type="file" id="fileIn" accept="application/json" style="display:none" onchange="importJSON(this)">
  </aside>

  <main class="main">
    <div class="top">
      <div><h2 id="vTitle">总览</h2><div class="sub" id="vSub"></div></div>
      <div class="spacer"></div>
      <div id="topActs" class="row"></div>
    </div>
    <div class="wrap" id="view"></div>
  </main>
</div>

<div id="modalRoot"></div>

<script>
/* ============ utils ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const PAL=['#6366f1','#0ea5e9','#10b981','#f59e0b','#ef4444','#8b5cf6','#14b8a6','#ec4899'];
const colorOf=n=>{let h=0;for(const c of String(n||'x'))h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length];};
const initials=n=>String(n||'?').trim().slice(-2);
const ICON={
 dash:'<path d="M3 12h7V3H3v9Zm11 9h7v-9h-7v9ZM3 21h7v-5H3v5ZM14 8h7V3h-7v5Z"/>',
 stu:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
 talk:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10Z"/>',
 path:'<path d="M3 6h4l3 6 4-12 3 6h4"/>',
 blog:'<path d="M4 4h16v16H4z"/><path d="M8 8h8M8 12h8M8 16h5"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
 trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
 x:'<path d="M18 6 6 18M6 6l12 12"/>',
 up:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M12 3v12M7 8l5-5 5 5"/>',
 dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
 share:'<path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v14"/>',
 eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
 chk:'<path d="M20 6 9 17l-5-5"/>'
};
const svg=(k,sz)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]||''}</svg>`;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);
  setTimeout(()=>t.remove(),2200);}

/* ============ data ============ */
const KEY='student-hub-v1';
function seed(){
  const s1=uid(),s2=uid(),s3=uid(),s4=uid();
  return {
    students:[
      {id:s1,name:'林知远',gender:'男',grade:'高二(3)班',group:'竞赛组',phone:'138****2210',guardian:'林父 / 138****2210',
       enroll:'2025-09-01',tags:['信息学','自律','冲刺省赛'],goal:'一年内拿到 NOIP 一等奖，并完成一个完整的开源项目。',status:'在读'},
      {id:s2,name:'陈牧',gender:'女',grade:'高一(1)班',group:'基础组',phone:'139****7745',guardian:'陈母 / 139****7745',
       enroll:'2026-02-20',tags:['Python入门','需要鼓励'],goal:'先补齐 Python 基础，学期末能独立写出一个爬虫小工具。',status:'在读'},
      {id:s3,name:'苏晚',gender:'女',grade:'高三(2)班',group:'作品集组',phone:'137****3390',guardian:'苏母 / 137****3390',
       enroll:'2024-09-01',tags:['创意编程','留学作品集'],goal:'完成 3 个交互作品，形成可用于申请的作品集网站。',status:'在读'},
      {id:s4,name:'何一诺',gender:'男',grade:'初三(5)班',group:'基础组',phone:'135****8821',guardian:'何父 / 135****8821',
       enroll:'2026-03-10',tags:['图形化转代码'],goal:'从图形化编程平稳过渡到代码编程，暑假前完成 20 道进阶题。',status:'在读'}
    ],
    interactions:[
      {id:uid(),sid:s1,date:'2026-08-28',type:'作业反馈',topic:'动态规划专题复盘',content:'专题 12 题中错 3 题，主要集中在状态定义不清。已要求把每题的状态转移方程手写一遍再提交。',next:'下周三前提交手写版状态方程，我逐题批注。'},
      {id:uid(),sid:s1,date:'2026-08-15',type:'一对一答疑',topic:'省赛策略沟通',content:'讨论了省赛的时间分配与暴力分拿法，确定先保前两题再冲第三题。',next:'做两套模拟赛，按比赛节奏计时。'},
      {id:uid(),sid:s2,date:'2026-08-30',type:'鼓励沟通',topic:'第一次独立完成调试',content:'陈牧自己定位到一个缩进错误并修复，情绪明显好转，愿意在群里提问了。',next:'下次课让她给同学讲一遍调试思路。'},

    <div class="modal${wide?' wide':''}">
      <div class="mh" style="justify-content:space-between"><h3>${esc(title)}</h3>

}
const F={};
F.input=(n,l,v,o={})=>`<div class="${o.full?'full':''}"><label class="f">${esc(l)}${o.req?' *':''}</label>
  <input type="${o.type||'text'}" name="${n}" value="${esc(v==null?'':v)}" ${o.req?'required':''} placeholder="${esc(o.ph||'')}"></div>`;
F.textarea=(n,l,v,o={})=>`<div class="${o.full!==false?'full':''}"><label class="f">${esc(l)}${o.req?' *':''}</label>
  <textarea name="${n}" ${o.req?'required':''} placeholder="${esc(o.ph||'')}" style="${o.h?`min-height:${o.h}px`:''}">${esc(v==null?'':v)}</textarea></div>`;
F.select=(n,l,v,opts,o={})=>`<div class="${o.full?'full':''}"><label class="f">${esc(l)}</label><select name="${n}">
  ${opts.map((x,i)=>{const val=x&&x.v!==undefined?x.v:x,lab=x&&x.l!==undefined?x.l:(o.labels?o.labels[i]:x);
    return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`;}).join('')}</select></div>`;
function openForm({title,body,values={},onSubmit,wide,okText='保存'}){
  openModal(title,`<form id="mForm" class="form">${body}</form>`,
    `<button class="btn" onclick="closeModal()">取消</button><button class="btn pri" type="submit" form="mForm">${okText}</button>`,wide);
  $('#mForm').addEventListener('submit',e=>{e.preventDefault();
    const d=Object.fromEntries(new FormData(e.target).entries());onSubmit(d);});
}
function confirmBox(msg,onOk,danger){
  openModal('确认操作',`<div style="font-size:14px;line-height:1.7">${msg}</div>`,
    `<button class="btn" onclick="closeModal()">取消</button>
     <button class="btn ${danger?'dan':'pri'}" id="okBtn">确定</button>`);
  $('#okBtn').onclick=()=>{closeModal();onOk();};
}

      F.textarea('next','下一步跟进',i.next,{ph:'下一次要检查什么（可留空）'}),

function delTalk(id){

function editPathTitle(id){
  const p=pathOf(id);

    onSubmit:d=>{if(!d.title.trim())return toast('请填写名称');
      db.paths[id]={...p,title:d.title.trim()};save();closeModal();render();}});
}
function editStage(sid,stid){
  const p=pathOf(sid),st=stid?p.stages.find(x=>x.id===stid):{status:'todo',due:''};
  openForm({title:stid?'编辑阶段':'新增阶段',wide:true,values:st,
    body:F.input('title','阶段名称',st.title,{full:1,req:1,ph:'如：动态规划专题'})+
      F.textarea('desc','阶段说明',st.desc,{ph:'要学什么、做到什么程度'})+
      F.input('due','目标完成时间',st.due,{type:'date'})+
      F.select('status','状态',st.status,[{v:'todo',l:'待开始'},{v:'doing',l:'进行中'},{v:'done',l:'已完成'}]),
    onSubmit:d=>{
      if(!d.title.trim())return toast('请填写阶段名称');
      const obj={...st,title:d.title.trim(),desc:d.desc.trim(),due:d.due,status:d.status};
      if(stid)Object.assign(p.stages.find(x=>x.id===stid),obj);else{obj.id=uid();p.stages.push(obj);}
      db.paths[sid]=p;save();closeModal();toast('已保存');render();

function setStage(sid,stid,status){const p=pathOf(sid);const st=p.stages.find(x=>x.id===stid);if(st)st.status=status;

function delStage(sid,stid){confirmBox('确定删除这个阶段吗？',()=>{const p=pathOf(sid);
  p.stages=p.stages.filter(x=>x.id!==stid);db.paths[sid]=p;save();toast('已删除');render();},true);}

/* ============ share ============ */
function shareText(sid){
  const s=S(sid),ps=postsOf(sid),p=pathOf(sid),pr=prog(p);
  return `【${s.name} 的成长档案】\n${s.grade||''} · 路径进度 ${pr.pct}%（${pr.d}/${pr.t} 阶段）\n\n`+
    ps.map(x=>`· ${x.date} [${x.type}] ${x.title}\n  ${x.summary||''}`).join('\n')+
    `\n\n共 ${ps.length} 项成果，${itsOf(sid).length} 次师生互动记录。`;
}
function copyShare(sid){
  const t=shareText(sid);
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>toast('分享摘要已复制'));
  else{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('分享摘要已复制');}catch(e){toast('复制失败，请手动选择');}ta.remove();}
}

function download(name,content,type){
  const b=new Blob([content],{type:type||'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function exportBlog(sid){const s=S(sid);download(`${s.name}-成长博客.html`,blogHTML(sid),'text/html;charset=utf-8');toast('已导出博客页');}
function exportJSON(){download(`学生数据备份-${today()}.json`,JSON.stringify(db,null,2),'application/json');toast('已导出数据备份');}
function importJSON(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(!d.students)throw 0;db=d;db.posts=db.posts||[];db.interactions=db.interactions||[];db.paths=db.paths||{};
    save();toast('数据已导入');render();}catch(e){toast('文件格式不正确');}inp.value='';};
  r.readAsText(f,'utf-8');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
render();
</script>
